# 备用的自动部署流程。
#
# 说明：当前账号因计费问题无法运行 GitHub Actions（"account is locked due to
# a billing issue"），因此这个工作流暂时是手动触发，平时发布请用 `npm run deploy`。
#
# 等计费问题解决后，把下面 on: 里的 push 两行恢复，就可以恢复「推代码即自动发布」：
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
